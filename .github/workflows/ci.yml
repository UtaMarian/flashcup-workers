name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/flashcup-workers

jobs:
  # ---------------------------------------------------------------- CI ----
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall runs `prisma generate` against the vendored schema
      - run: npm ci

      - name: Smoke — every shared backend module + Prisma client resolves
        run: node -e "require('./src/shared'); require('./src/jobs/matchScheduler'); require('./src/jobs/energyJob'); require('./src/jobs/managerPollJob'); require('./src/jobs/eventsJob'); require('./src/jobs/dailyBonusJob'); console.log('workers load OK')"

  # ------------------------------------------------------------- PUBLISH ----
  publish:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
